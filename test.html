<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Image</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Button styling */
        #showImageButton {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 20px;
        }

        #showImageButton:hover {
            background-color: #0056b3;
        }

        /* Fullscreen popup styling */
        #popupImage {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #popupImage img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* Close button styling */
        #closeButton {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            text-align: center;
            line-height: 40px;
            cursor: pointer;
        }

        #closeButton:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>
    <button id="showImageButton">Show Image</button>

    <div id="popupImage">
        <button id="closeButton">&times;</button>
        <img src="https://via.placeholder.com/800" alt="Popup Image">
    </div>

    <script>
        const showImageButton = document.getElementById('showImageButton');
        const popupImage = document.getElementById('popupImage');
        const closeButton = document.getElementById('closeButton');

        // Show the popup image
        showImageButton.addEventListener('click', () => {
            popupImage.style.display = 'flex';
        });

        // Hide the popup image
        closeButton.addEventListener('click', () => {
            popupImage.style.display = 'none';
        });

        // Hide the popup image when clicking outside of it
        popupImage.addEventListener('click', (event) => {
            if (event.target === popupImage) {
                popupImage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
